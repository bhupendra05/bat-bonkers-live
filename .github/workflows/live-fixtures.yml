name: live-fixtures
on: { schedule: [{ cron: "15 */2 * * *" }], workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node fetch-fixtures.mjs fixtures.json
        env: { CRICKETLIVE_API_KEY: "${{ secrets.CRICKETLIVE_API_KEY }}", CRICAPI_KEY: "${{ secrets.CRICAPI_KEY }}" }
      - run: |
          git config user.name "live-fixtures"; git config user.email "actions@users.noreply.github.com"
          git add fixtures.json; git diff --cached --quiet || git commit -m "fixtures $(date -u +%F' '%H:%M)"; git push
